# Each plugin ships as a single self-contained HTML file with no build pipeline in this repository,
# which is why three Blueprint defects of the same shape each reached production. These gates are the
# pipeline. They are cheap, they run on every push, and they are the reason a hand-edit can no
# longer quietly reintroduce a defect we have already paid for once.
name: verify
on:
  push:
    branches: [main, 'release/**']
  pull_request:
# Least privilege: the gates only read the checkout. (Code scanning: workflow did not limit GITHUB_TOKEN.)
permissions:
  contents: read
# Actions are pinned to full commit SHAs (tag in the comment): a tag can be moved by its owner, a SHA cannot.
# The runner is pinned too, so an image change is a deliberate commit, not a surprise. Node 22 (LTS); the
# actions' own Node 20 runtime was deprecated, hence v5.
jobs:
  verify:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: mcp-blueprints/revizto-project-intelligence
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }   # the gates never push; keep the token out of .git/config
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: '22' }
      - name: manifest describes the asset beside it
        run: node tools/build.mjs --check
      - name: regression gates (syntax, contract, taxonomy, hygiene, manifest, claude.ai build)
        run: node tests/run.mjs
  matrix:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: plugins/revizto-pi-matrix
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }   # the gates never push; keep the token out of .git/config
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: '22' }
      - name: the gates can fail (each injected defect must go red)
        run: node tools/verify.mjs --selftest
      - name: the claude.ai port refuses what it cannot fully apply, and both claude.ai builds are its output
        run: node ../../tools/claudeai/port.mjs --selftest && node ../../tools/claudeai/port.mjs --check && node ../../tools/claudeai/shim.test.mjs
      - name: asset, public-safe, read-only, version and licence gates
        run: node tools/verify.mjs
