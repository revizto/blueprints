# Each plugin ships as a single self-contained HTML file with no build pipeline in this repository,
# which is why three Blueprint defects of the same shape each reached production. These gates are the
# pipeline. They are cheap, they run on every push, and they are the reason a hand-edit can no
# longer quietly reintroduce a defect we have already paid for once.
name: verify
on:
  push:
    branches: [main, 'release/**']
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-blueprints/revizto-project-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: manifest describes the asset beside it
        run: node tools/build.mjs --check
      - name: regression gates (syntax, contract, taxonomy, hygiene, manifest)
        run: node tests/run.mjs
  matrix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/revizto-pi-matrix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: the gates can fail (each injected defect must go red)
        run: node tools/verify.mjs --selftest
      - name: asset, public-safe, read-only, version and licence gates
        run: node tools/verify.mjs
